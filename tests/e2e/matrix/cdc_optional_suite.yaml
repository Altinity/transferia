name: local-cdc-optional
version: 1
scope: open-source-cdc-optional
waves:
  - id: optional-queues
    description: Optional queue source flows to ClickHouse
    suites:
      - suite_name: e2e-kafka2ch
        suite_group: tests/e2e
        suite_path: kafka2ch
      - suite_name: e2e-eventhub2ch
        suite_group: tests/e2e
        suite_path: eventhub2ch
      - suite_name: e2e-kinesis2ch
        suite_group: tests/e2e
        suite_path: kinesis2ch
  - id: optional-connectors
    description: Optional connector source flows to ClickHouse
    suites:
      - suite_name: e2e-airbyte2ch
        suite_group: tests/e2e
        suite_path: airbyte2ch
      - suite_name: e2e-oracle2ch
        suite_group: tests/e2e
        suite_path: oracle2ch
  - id: optional-clickhouse-source
    description: Optional ClickHouse source flows
    suites:
      - suite_name: e2e-ch2ch
        suite_group: tests/e2e
        suite_path: ch2ch
matrix: {}
